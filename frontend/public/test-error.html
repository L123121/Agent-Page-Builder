<!DOCTYPE html>
<html>
<head><title>Error Check</title></head>
<body>
<div id="app">test</div>
<script type="module">
window.addEventListener('error', (e) => {
    document.body.innerHTML = '<pre>ERROR: ' + e.message + '\n' + (e.error?.stack || '') + '</pre>'
})
window.addEventListener('unhandledrejection', (e) => {
    document.body.innerHTML = '<pre>REJECTION: ' + (e.reason?.message || e.reason) + '\n' + (e.reason?.stack || '') + '</pre>'
})
import('/src/main.ts').then(() => {
    setTimeout(() => {
        const app = document.getElementById('app')
        if (!app || app.innerHTML === 'test') {
            document.body.innerHTML = '<pre>APP DID NOT MOUNT</pre>'
        } else {
            document.body.innerHTML = '<pre>APP MOUNTED: ' + app.innerHTML.slice(0, 200) + '</pre>'
        }
    }, 3000)
}).catch(e => {
    document.body.innerHTML = '<pre>IMPORT FAILED: ' + e.message + '\n' + e.stack + '</pre>'
})
</script>
</body>
</html>
